name: Construire l APK Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snack-attack-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verifier ou installer les outils audio
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v espeak >/dev/null 2>&1 || missing+=(espeak)
          command -v unzip >/dev/null 2>&1 || missing+=(unzip)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Installer Capacitor et les plugins natifs
        run: npm install --no-audit --no-fund

      - name: Preparer le jeu
        run: npm run prepare:web

      - name: Verifier le menu les effets et la boutique cachee
        run: |
          test -s www/menu-refresh.css
          test -s www/screen-splashes.js
          test -s www/screen-splashes.css
          test -s www/shop-config.js
          test -s www/shop.js
          test -s www/shop.css
          node --check www/screen-splashes.js
          node --check www/v2-system.js
          node --check www/shop-config.js
          node --check www/shop.js
          grep -F "SnackScreenFX?.explodeAt" www/v2-system.js
          grep -F "getBoundingClientRect" www/v2-system.js
          grep -F "gameMode === 'relax'" www/v2-system.js
          grep -F "enabled: false" www/shop-config.js
          grep -F "id=\"relaxBtn\"" www/index.html

      - name: Verifier les sons generes
        run: |
          test -s www/audio/music-loop.mp3
          test -s www/audio/music-loop.ogg
          test -s www/audio/pop.ogg
          test -s www/audio/bomb.ogg
          test -s www/audio/rainbow.ogg
          test -s www/audio/combo.ogg
          test -s www/audio/super.ogg
          test -s www/audio/mega.ogg
          test -s www/audio/legendary.ogg
          test -s www/native-feedback.js
          test -s www/theme-effects.js
          test -s www/theme-effects.css

      - name: Creer le projet Android
        run: npx cap add android

      - name: Generer la nouvelle icone et le splash natif
        run: npm run android:assets

      - name: Synchroniser le jeu et les plugins natifs
        run: npx cap sync android

      - name: Copier les sons natifs et activer la vibration
        run: npm run prepare:android-feedback

      - name: Verifier les plugins et ressources Android
        run: |
          grep -R "NativeAudio" android/app/src/main/assets/capacitor.plugins.json
          grep -R "Haptics" android/app/src/main/assets/capacitor.plugins.json
          grep -R "android.permission.VIBRATE" android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/assets/public/menu-refresh.css
          test -s android/app/src/main/assets/public/screen-splashes.js
          test -s android/app/src/main/assets/public/shop-config.js
          test -s android/app/src/main/assets/public/shop.js
          grep -F "enabled: false" android/app/src/main/assets/public/shop-config.js

      - name: Compiler l APK installable
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verifier le contenu final de l APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/public/menu-refresh.css"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/public/screen-splashes.js"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/public/shop-config.js"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/public/shop.js"

      - name: Renommer l APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Snack-Attack-Autonomous.apk

      - name: Publier l artefact
        uses: actions/upload-artifact@v4
        with:
          name: Snack-Attack-Autonomous
          path: Snack-Attack-Autonomous.apk
          retention-days: 30
          if-no-files-found: error

      - name: Mettre a jour le telechargement permanent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view autonome-latest >/dev/null 2>&1; then
            gh release delete autonome-latest --cleanup-tag --yes
          fi
          gh release create autonome-latest Snack-Attack-Autonomous.apk \
            --target "$GITHUB_SHA" \
            --title "Snack Attack autonome" \
            --notes "Snack Attack avec nouveau menu, mode detente, effets de lame et boutique cachee desactivee."
