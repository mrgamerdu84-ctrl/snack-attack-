name: Construire l APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snack-attack-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les outils audio si necessaire
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v espeak >/dev/null 2>&1 || missing+=(espeak)
          command -v unzip >/dev/null 2>&1 || missing+=(unzip)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Installer les dependances
        run: npm install --no-audit --no-fund

      - name: Preparer le jeu
        run: npm run prepare:web

      - name: Verifier les fonctions V3
        run: |
          test -s www/menu-refresh.css
          test -s www/screen-splashes.js
          test -s www/screen-splashes.css
          test -s www/shop-config.js
          test -s www/shop.js
          test -s www/shop.css
          node --check www/screen-splashes.js
          node --check www/v2-system.js
          node --check www/shop-config.js
          node --check www/shop.js
          grep -F "SnackScreenFX?.explodeAt" www/v2-system.js
          grep -F "getBoundingClientRect" www/v2-system.js
          grep -F "gameMode === 'relax'" www/v2-system.js
          grep -F "enabled: false" www/shop-config.js

      - name: Creer Android
        run: npx cap add android

      - name: Generer icone et splash
        run: npm run android:assets

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Preparer sons et vibration
        run: |
          if [ ! -s audio/music-loop.mp3 ] && [ -s audio/music-loop.ogg ]; then
            ffmpeg -y -loglevel error -i audio/music-loop.ogg -codec:a libmp3lame -b:a 128k audio/music-loop.mp3
          fi
          test -s audio/music-loop.mp3
          npm run prepare:android-feedback

      - name: Compiler l APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verifier l APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/public/menu-refresh.css"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/public/screen-splashes.js"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/public/shop-config.js"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/public/shop.js"

      - name: Renommer l APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Snack-Attack-V3.apk

      - name: Publier l artefact
        uses: actions/upload-artifact@v4
        with:
          name: Snack-Attack-V3
          path: Snack-Attack-V3.apk
          retention-days: 30
          if-no-files-found: error
