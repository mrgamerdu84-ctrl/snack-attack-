name: Construire l APK Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snack-attack-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les outils audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak unzip curl

      - name: Installer Capacitor et les plugins natifs
        run: npm install --no-audit --no-fund

      - name: Preparer le jeu et les fichiers audio hors ligne
        run: npm run prepare:web

      - name: Verifier les sons embarques
        run: |
          test -s www/audio/music-loop.ogg
          test -s www/audio/pop.ogg
          test -s www/audio/bomb.ogg
          test -s www/audio/rainbow.ogg
          test -s www/audio/combo.ogg
          test -s www/audio/super.ogg
          test -s www/audio/mega.ogg
          test -s www/audio/legendary.ogg
          test -s www/native-feedback.js
          echo "Fichiers audio presents :"
          find www/audio -maxdepth 1 -type f -printf '%f %s octets\n' | sort

      - name: Creer le projet Android
        run: npx cap add android

      - name: Generer la nouvelle icone et le splash natif
        run: npm run android:assets

      - name: Synchroniser le jeu et les plugins natifs
        run: npx cap sync android

      - name: Verifier les plugins Android
        run: |
          grep -R "NativeAudio" android/app/src/main/assets/capacitor.plugins.json
          grep -R "Haptics" android/app/src/main/assets/capacitor.plugins.json
          test -s android/app/src/main/assets/public/audio/music-loop.ogg
          test -s android/app/src/main/assets/public/audio/legendary.ogg

      - name: Compiler l APK installable
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Snack-Attack-Autonomous.apk

      - name: Publier l artefact
        uses: actions/upload-artifact@v4
        with:
          name: Snack-Attack-Autonomous
          path: Snack-Attack-Autonomous.apk
          retention-days: 30
          if-no-files-found: error

      - name: Mettre a jour le telechargement permanent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view autonome-latest >/dev/null 2>&1; then
            gh release delete autonome-latest --cleanup-tag --yes
          fi
          gh release create autonome-latest Snack-Attack-Autonomous.apk \
            --target "$GITHUB_SHA" \
            --title "Snack Attack autonome" \
            --notes "Snack Attack avec musique, annonces, effets sonores et vibrations Android natifs. Compilation GitHub Actions numero $GITHUB_RUN_NUMBER."
